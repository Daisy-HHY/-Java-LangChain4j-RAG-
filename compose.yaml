name: kgqa

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg18-trixie
    environment:
      POSTGRES_DB: kgqa
      POSTGRES_USER: ${KGQA_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${KGQA_DB_PASSWORD:-123456}
    ports:
      - "127.0.0.1:${KGQA_DB_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 stores PGDATA under /var/lib/postgresql/18/docker.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    profiles: ["app"]
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      KGQA_DB_URL: jdbc:postgresql://postgres:5432/kgqa
      KGQA_DB_USERNAME: ${KGQA_DB_USERNAME:-postgres}
      KGQA_DB_PASSWORD: ${KGQA_DB_PASSWORD:-123456}
      KGQA_TDB_PATH: /data/tdb_drug_new
      UPLOAD_PATH: /data/uploads
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      SILICONFLOW_BASE_URL: ${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
      SILICONFLOW_EMBEDDING_MODEL: ${SILICONFLOW_EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-8B}
      SILICONFLOW_CHAT_MODEL: ${SILICONFLOW_CHAT_MODEL:-MiniMaxAI/MiniMax-M2.5}
      KGQA_AUTH_TOKEN_SECRET: ${KGQA_AUTH_TOKEN_SECRET:-kgqa-local-development-change-me}
      KGQA_DEFAULT_ADMIN_USERNAME: ${KGQA_DEFAULT_ADMIN_USERNAME:-admin}
      KGQA_DEFAULT_ADMIN_PASSWORD: ${KGQA_DEFAULT_ADMIN_PASSWORD:-admin123}
      KGQA_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      KGQA_AUTH_COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - type: bind
        source: ${KGQA_TDB_HOST_PATH:-./.runtime/tdb_drug_new}
        target: /data/tdb_drug_new
        bind:
          create_host_path: false
      - type: bind
        source: ${KGQA_UPLOAD_HOST_PATH:-./uploads}
        target: /data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8080
      VITE_API_BASE_URL: /api
      VITE_USE_POLLING: ${VITE_USE_POLLING:-false}
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  frontend_node_modules:
